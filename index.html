<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>富士急ハイランド旅行のしおり</title>
<style>
  :root {
    --color-primary-dark: #103d47;
    --color-accent: #e8935a;
    --color-bg: #f7f6f2;
    --color-card: #ffffff;
    --color-text: #2b2b2b;
    --color-text-light: #6b6b6b;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.8;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--color-card);
    border-radius: 12px;
    border-top: 6px solid var(--color-accent);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    text-align: center;
  }

  .card__photo {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  .card__body {
    padding: 28px 28px 32px;
  }

  .card__title {
    margin: 0 0 4px;
    font-size: 1.4rem;
    color: var(--color-primary-dark);
  }

  .card__sub {
    margin: 0 0 20px;
    font-size: 0.85rem;
    color: var(--color-text-light);
  }

  .card__message {
    margin: 0 0 12px;
  }

  .card__note {
    margin: 24px 0 0;
    font-size: 0.8rem;
    color: var(--color-text-light);
  }
</style>
</head>
<body>
  <main class="card">
    <img class="card__photo" src="fujiq.jpg" alt="青空の下の富士急ハイランドのコースターと富士山" width="1600" height="1200">
    <div class="card__body">
      <h1 class="card__title">2日間おつかれさまでした！</h1>
      <p class="card__sub">富士急ハイランド旅行（11/8〜11/9）</p>
      <p class="card__message">みんなのおかげで、楽しい旅行になりました。<br>参加してくれてありがとうございました。</p>
      <p class="card__message">旅行が終わったので、しおりの内容は削除しました。</p>
      <p class="card__note">このページも近いうちに公開を終了します。</p>
    </div>
  </main>
</body>
</html>
